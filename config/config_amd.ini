# Port mapping for the AMD production board (ASRock IMB-A8000M).
# Captured with tools/inventory.py on the real AMD board (2026-07-28).
#
# Hardware layout found on this board:
#   enp2s0 / enp3s0        = onboard 2 ports   (Realtek, driver r8169)
#   enp1s0f0 .. enp1s0f3   = add-in card       (Intel I350-T4V2, driver igb)
#
# LAN order below follows the SAME physical convention as the Intel dev
# machine (LAN1/LAN2 = onboard, LAN3-LAN6 = I350 card in bracket order
# f3 -> f0).
#
# !! VERIFY the physical order once with the LED blink test before mass
# !! production:  sudo ethtool -p <ifname> 10
#
# NOTE: enp3s0 is the port currently carrying the remote (AnyDesk)
# connection. Do NOT apply settings to it while working remotely.

[board]
name = AMD-QC
description = ASRock IMB-A8000M production board (real capture 2026-07-28)

[port_map]
LAN1 = enp3s0      # onboard 1 (r8169)
LAN2 = enp2s0      # onboard 2 (r8169)
LAN3 = enp1s0f3    # I350-T4V2 (igb)
LAN4 = enp1s0f2    # I350-T4V2 (igb)
LAN5 = enp1s0f1    # I350-T4V2 (igb)
LAN6 = enp1s0f0    # I350-T4V2 (igb)
