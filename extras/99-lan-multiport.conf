# 同一サブネットに複数のLANポートを設定する場合の設定
# ---------------------------------------------------------------------------
# Linux は既定で rp_filter（逆経路フィルタ）が strict(1) のため、同一サブネット
# の複数ポートに応答が届くと「経路が一致しない」と判断して破棄します。
# その結果、疎通できるポートが1つだけになります。
#
# 2 = loose モード（RFC3704）。いずれかの経路で到達可能なら受け入れます。
# 送信元アドレスの詐称防止は維持されるため、0（無効）より安全です。
#
# 導入方法:
#     sudo cp 99-lan-multiport.conf /etc/sysctl.d/
#     sudo sysctl --system
#
# 確認方法:
#     sysctl net.ipv4.conf.all.rp_filter        # → 2 になっていること
#
# ※ 各LANポートを別サブネットで運用する場合、この設定は不要です。
# ---------------------------------------------------------------------------

net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
